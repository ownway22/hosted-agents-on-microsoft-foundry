# 此 Agent 的唯一識別名稱
name: hosted-agents-on-microsoft-foundry
# 簡要描述此 Agent 的功能
description: >
  Zava Corporation 的 HR 專員 Agent，使用 Azure AI Search
  知識庫回答有關 HR 政策、PTO、福利及員工手冊的問題。
  從獨立的 Agent Framework Agent 改造為容器化的 Hosted Agent，
  部署於 Microsoft Foundry。
metadata:
  authors:
    - Your Name
  tags:
    - Azure AI AgentServer
    - Microsoft Agent Framework
    - HR
    - Knowledge Base
    - Azure AI Search
template:
  name: hosted-agents-on-microsoft-foundry
  # "hosted" = Foundry-managed infrastructure (HOBO)
  kind: hosted
  protocols:
    - protocol: responses
  environment_variables:
    - name: AZURE_AI_PROJECT_ENDPOINT
      value: ${AZURE_AI_PROJECT_ENDPOINT}
    - name: AZURE_SEARCH_ENDPOINT
      value: ${AZURE_SEARCH_ENDPOINT}
    - name: MODEL_DEPLOYMENT_NAME
      value: "{{chat}}"
resources:
  - kind: model
    id: gpt-4.1
    name: chat
