name: hosted-agents-on-microsoft-foundry
description: >
  Zava Corporation 的 HR 專員 Agent — 企業級部署，包含
  Customer-Managed Keys、Managed Identity 驗證及 Private Endpoint。
  Agent 邏輯與第一部分相同，基礎設施為企業級。
metadata:
  authors:
    - Your Name
  tags:
    - Azure AI AgentServer
    - Microsoft Agent Framework
    - HR
    - Enterprise
    - CMK
    - Managed Identity
    - Private Endpoints
template:
  name: hosted-agents-on-microsoft-foundry
  kind: hosted
  protocols:
    - protocol: responses
  environment_variables:
    - name: AZURE_AI_PROJECT_ENDPOINT
      value: ${AZURE_AI_PROJECT_ENDPOINT}
    - name: AZURE_SEARCH_ENDPOINT
      value: ${AZURE_SEARCH_ENDPOINT}
    - name: MODEL_DEPLOYMENT_NAME
      value: "{{chat}}"
resources:
  - kind: model
    id: gpt-4.1
    name: chat
